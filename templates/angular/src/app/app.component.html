<div class="app-layout">
  <!-- Top Navigation Bar -->
  <app-chat-header [title]="title()" [status]="agentStatus()"></app-chat-header>

  <!-- Chat Workspace -->
  <main class="chat-container">
    <div class="messages-stream">
      <div *ngFor="let msg of messages()" class="message-row" [ngClass]="msg.sender">
        <!-- Metadata: Sender and Timestamp -->
        <div class="sender-info">
          <span class="sender-name">{{ msg.sender === 'user' ? 'You' : 'Weather Agent' }}</span>
          <span class="time-stamp">{{ msg.timestamp }}</span>
        </div>

        <!-- Horizontal Bubble Row: Avatar + Message Body on same level -->
        <div class="message-bubble-wrapper" [ngClass]="msg.sender">
          <div class="avatar" [ngClass]="msg.sender">
            <svg *ngIf="msg.sender === 'user'" class="google-user-avatar" viewBox="0 0 24 24" width="22" height="22">
              <path fill="#1a73e8" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <svg *ngIf="msg.sender === 'agent'" class="adk-agent-avatar" viewBox="0 0 24 24" width="22" height="22">
              <defs>
                <linearGradient id="adkAvatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#1a73e8" />
                  <stop offset="60%" stop-color="#4285f4" />
                  <stop offset="100%" stop-color="#34a853" />
                </linearGradient>
              </defs>
              <path fill="url(#adkAvatarGrad)" d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/>
            </svg>
          </div>

          <div class="message-content">
            <!-- Render A2UI Component Surface if present and successfully processed -->
            <div *ngIf="msg.surfaceId" class="a2ui-surface-wrapper">
              <a2ui-v09-surface [surfaceId]="msg.surfaceId"></a2ui-v09-surface>
            </div>

            <!-- Fallback: Display markdown-rendered text only when A2UI surface is not present -->
            <div *ngIf="!msg.surfaceId && msg.text" class="text-body markdown-content" [innerHTML]="msg.text | markdown">
            </div>
          </div>
        </div>
      </div>

      <!-- Agent Thinking / Loading Component -->
      <app-agent-loader *ngIf="agentStatus() === 'executing'"></app-agent-loader>
    </div>

    <!-- User Input Component -->
    <app-chat-input
      [disabled]="agentStatus() === 'executing'"
      (sendMessage)="sendMessage($event)"
    ></app-chat-input>
  </main>
</div>
