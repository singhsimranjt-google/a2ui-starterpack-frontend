[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "Gemini Enterprise (GE) Custom Agent & Renderer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.1",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
