[project]
name = "weather_agent"
version = "0.1.0"
description = "Google ADK & A2UI Agent Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.1",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "google-adk>=2.8.0",
    "a2ui-agent-sdk>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["weather_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
